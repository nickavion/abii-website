name: Deploy to GitHub Pages

on:
  # Every push to main republishes the site.
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs deps, runs `astro build`, and uploads dist/ as the Pages
      # artifact. `path` and `node-version` are read from the repo root.
      - name: Build
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Kit form id for the waitlist ("Website waitlist" form in Kit). It is
          # public — it appears in the page's HTML — so it lives here. A
          # repository variable of the same name overrides it.
          PUBLIC_KIT_FORM_ID: ${{ vars.PUBLIC_KIT_FORM_ID || '10070762' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
